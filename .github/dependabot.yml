version: 2

updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "cron"
          cronjob: "11 3 * * 4"
          timezone: "Europe/Berlin"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 15
      assignees:
          - "Voodoo2man"
      versioning-strategy: "increase"
      ignore:
          - dependency-name: "@types/node"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "npm"
      directory: "/src-admin"
      schedule:
          interval: "cron"
          cronjob: "17 3 * * 4"
          timezone: "Europe/Berlin"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 15
      assignees:
          - "Voodoo2man"
      versioning-strategy: "increase"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "cron"
          cronjob: "23 3 * * 2"
          timezone: "Europe/Berlin"
      open-pull-requests-limit: 15
      assignees:
          - "Voodoo2man"
